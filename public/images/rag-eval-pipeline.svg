<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAG evaluation pipeline: generate and critique loop producing a filtered eval set, then judged scores">
  <rect width="600" height="340" fill="#11151a"/>
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- corpus -->
  <rect x="44" y="70" width="104" height="64" rx="5" fill="#0d1117" stroke="#2ea043" stroke-width="1.4"/>
  <text x="96" y="96" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">1,041</text>
  <text x="96" y="112" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">chapters</text>
  <text x="96" y="126" font-family="monospace" font-size="10" fill="#8b949e" text-anchor="middle">26 subjects</text>

  <!-- generate -->
  <rect x="188" y="52" width="104" height="44" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
  <text x="240" y="72" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">generate</text>
  <text x="240" y="86" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">model A</text>

  <!-- critique -->
  <rect x="188" y="112" width="104" height="44" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
  <text x="240" y="132" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">critique</text>
  <text x="240" y="146" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">model B</text>

  <!-- loop arrows -->
  <path d="M148 102 L188 78" stroke="#3fb950" stroke-width="1.4" fill="none"/>
  <path d="M240 96 L240 112" stroke="#3fb950" stroke-width="1.4"/>
  <path d="M188 134 L166 134 L166 74 L188 74" stroke="#2ea043" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <path d="M292 134 L340 134" stroke="#3fb950" stroke-width="1.4"/>
  <!-- rejected -->
  <path d="M240 156 L240 184" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="248" y="182" font-family="monospace" font-size="9" fill="#f85149">rejected</text>

  <!-- eval set -->
  <rect x="340" y="112" width="104" height="44" rx="5" fill="#0d1117" stroke="#2ea043" stroke-width="1.4"/>
  <text x="392" y="132" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="middle">eval set</text>
  <text x="392" y="146" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">filtered</text>

  <!-- judge scores -->
  <text x="44" y="232" font-family="monospace" font-size="11" fill="#8b949e">judge</text>
  <rect x="44" y="242" width="504" height="1" fill="#21262d"/>

  <text x="44" y="266" font-family="monospace" font-size="10" fill="#8b949e">correctness</text>
  <rect x="150" y="257" width="180" height="8" rx="2" fill="#0d1117" stroke="#21262d"/>
  <rect x="150" y="257" width="166" height="8" rx="2" fill="#3fb950"/>

  <text x="44" y="288" font-family="monospace" font-size="10" fill="#8b949e">faithfulness</text>
  <rect x="150" y="279" width="180" height="8" rx="2" fill="#0d1117" stroke="#21262d"/>
  <rect x="150" y="279" width="158" height="8" rx="2" fill="#2ea043"/>

  <text x="44" y="310" font-family="monospace" font-size="10" fill="#8b949e">retrieval</text>
  <rect x="150" y="301" width="180" height="8" rx="2" fill="#0d1117" stroke="#21262d"/>
  <rect x="150" y="301" width="36" height="8" rx="2" fill="#f85149"/>
  <text x="196" y="309" font-family="monospace" font-size="9" fill="#f85149">20 chapters @ 1.0/5</text>

  <!-- rerank comparison -->
  <rect x="368" y="250" width="180" height="66" rx="5" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>
  <text x="382" y="270" font-family="monospace" font-size="10" fill="#8b949e">rerank on</text>
  <text x="524" y="270" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="end">4.60</text>
  <text x="382" y="290" font-family="monospace" font-size="10" fill="#8b949e">rerank off</text>
  <text x="524" y="290" font-family="monospace" font-size="11" fill="#c9d1d9" text-anchor="end">4.59</text>
  <text x="382" y="308" font-family="monospace" font-size="9" fill="#f85149">228 matched runs — no gain</text>
</svg>

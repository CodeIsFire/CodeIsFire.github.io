<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="340" fill="#11151a"/>
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#21262d" stroke-width="2"/>
  <!-- two opposing "articles" balancing on a fulcrum, representing bias comparison -->
  <line x1="80" y1="230" x2="520" y2="230" stroke="#3fb950" stroke-width="3"/>
  <polygon points="300,230 270,270 330,270" fill="#3fb950"/>
  <!-- left article card -->
  <g>
    <rect x="90" y="120" width="170" height="100" rx="4" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <rect x="105" y="136" width="90" height="8" fill="#3fb950"/>
    <rect x="105" y="154" width="140" height="4" fill="#8b949e"/>
    <rect x="105" y="166" width="140" height="4" fill="#8b949e"/>
    <rect x="105" y="178" width="100" height="4" fill="#8b949e"/>
    <rect x="105" y="196" width="60" height="6" fill="#3fb950" opacity="0.6"/>
  </g>
  <!-- right article card -->
  <g>
    <rect x="340" y="120" width="170" height="100" rx="4" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <rect x="355" y="136" width="90" height="8" fill="#3fb950"/>
    <rect x="355" y="154" width="140" height="4" fill="#8b949e"/>
    <rect x="355" y="166" width="140" height="4" fill="#8b949e"/>
    <rect x="355" y="178" width="110" height="4" fill="#8b949e"/>
    <rect x="355" y="196" width="60" height="6" fill="#3fb950" opacity="0.6"/>
  </g>
  <text x="300" y="80" font-family="JetBrains Mono, monospace" font-size="22" fill="#c9d1d9" text-anchor="middle">TATASTHA</text>
  <text x="300" y="300" font-family="JetBrains Mono, monospace" font-size="13" fill="#8b949e" text-anchor="middle">bias-scoring across sources</text>
</svg>

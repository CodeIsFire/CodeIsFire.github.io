<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reconcile to Recover: ledger and gateway rows matched into exceptions, then confirmed by webhook">
  <rect width="600" height="340" fill="#11151a"/>
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- left column: ledger -->
  <text x="52" y="62" font-family="monospace" font-size="13" fill="#8b949e">ledger</text>
  <rect x="52" y="74" width="132" height="20" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
  <rect x="52" y="102" width="132" height="20" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
  <rect x="52" y="130" width="132" height="20" rx="3" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>
  <rect x="52" y="158" width="132" height="20" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
  <rect x="52" y="186" width="132" height="20" rx="3" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>

  <!-- right column: gateway -->
  <text x="416" y="62" font-family="monospace" font-size="13" fill="#8b949e">gateway</text>
  <rect x="416" y="74" width="132" height="20" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
  <rect x="416" y="102" width="132" height="20" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
  <rect x="416" y="130" width="132" height="20" rx="3" fill="#0d1117" stroke="#2ea043" stroke-width="1.2"/>
  <rect x="416" y="158" width="132" height="20" rx="3" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>
  <rect x="416" y="186" width="132" height="20" rx="3" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>

  <!-- matches -->
  <path d="M184 84 L416 84" stroke="#3fb950" stroke-width="1.4"/>
  <path d="M184 112 L416 112" stroke="#3fb950" stroke-width="1.4"/>
  <!-- split: one ledger row to two gateway rows -->
  <path d="M184 168 L300 168 L300 140 L416 140" stroke="#3fb950" stroke-width="1.4" fill="none"/>
  <!-- unmatched -->
  <path d="M184 140 L250 140" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="258" cy="140" r="4" fill="#f85149"/>
  <path d="M416 168 L350 168" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="342" cy="168" r="4" fill="#f85149"/>

  <!-- pipeline strip -->
  <rect x="52" y="238" width="496" height="52" rx="5" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>
  <text x="70" y="262" font-family="monospace" font-size="12" fill="#3fb950">classify</text>
  <text x="146" y="262" font-family="monospace" font-size="12" fill="#8b949e">&#8594;</text>
  <text x="168" y="262" font-family="monospace" font-size="12" fill="#3fb950">route</text>
  <text x="228" y="262" font-family="monospace" font-size="12" fill="#8b949e">&#8594;</text>
  <text x="250" y="262" font-family="monospace" font-size="12" fill="#3fb950">payout</text>
  <text x="320" y="262" font-family="monospace" font-size="12" fill="#8b949e">&#8594;</text>
  <text x="342" y="262" font-family="monospace" font-size="12" fill="#3fb950">webhook</text>
  <text x="70" y="280" font-family="monospace" font-size="10" fill="#8b949e">8 causes</text>
  <text x="168" y="280" font-family="monospace" font-size="10" fill="#8b949e">bounded</text>
  <text x="250" y="280" font-family="monospace" font-size="10" fill="#8b949e">at most once</text>
  <text x="342" y="280" font-family="monospace" font-size="10" fill="#8b949e">confirms</text>
  <rect x="330" y="246" width="104" height="38" rx="4" fill="none" stroke="#3fb950" stroke-width="1.4"/>
</svg>
